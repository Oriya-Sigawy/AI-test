[project]
name = "expense-tracker"
version = "0.1.0"
description = "REST API for a personal expense tracking application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "typer>=0.12",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "bandit>=1.7",
    "httpx2>=2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Volume/load tests create large datasets and are slower than the behavioral suite, so they
# are opt-in: the default run excludes them; run them with `pytest -m slow`.
markers = [
    "slow: volume/load test over a large dataset; deselected by default, run via -m slow",
]
addopts = "-m 'not slow'"
